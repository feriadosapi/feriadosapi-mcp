name: Publish to npm

# Aciona o workflow sempre que uma nova Release for publicada no GitHub
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    # PERMISSÕES OBRIGATÓRIAS PARA OIDC E PROVENANCE (Trusted Publishing)
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Notes & Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing (requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build stdio (npm package)
        run: npm run build:stdio

      - name: Publish package via OIDC Trusted Publisher
        run: npm publish --access public --provenance
